        body {
            font-family: 'Inter', sans-serif;
            background-color: #02040a;
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
        }
        .canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 80%),
                linear-gradient(to right, rgba(30, 41, 59, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.25) 1px, transparent 1px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        .node-card {
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(16px);
        }
        .node-card.interactive:hover {
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.45), 0 10px 25px -5px rgba(0, 0, 0, 0.9);
            border-color: #38bdf8;
        }
        /* High visibility glowing SVG lines */
        .mindmap-line {
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.9));
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #060913;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        const workspace = document.getElementById('mindmapWorkspace');
        const nodesContainer = document.getElementById('nodesContainer');
        const container = document.getElementById('canvasContainer');

        const rootX = 4000;
        const rootY = 4000;

        function updateTransform() {
            workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function zoomIn() {
            const centerX = container.clientWidth / 2;
            const centerY = container.clientHeight / 2;
            zoomToPoint(centerX, centerY, 1.2);
        }

        function zoomOut() {
            const centerX = container.clientWidth / 2;
            const centerY = container.clientHeight / 2;
            zoomToPoint(centerX, centerY, 1 / 1.2);
        }

        function resetView() {
            scale = 0.7;
            panX = container.clientWidth / 2 - rootX * scale;
            panY = container.clientHeight / 2 - rootY * scale;
            updateTransform();
        }

        function zoomToPoint(clientX, clientY, factor) {
            const newScale = Math.max(0.3, Math.min(2.5, scale * factor));
            if (newScale === scale) return;

            panX = clientX - (clientX - panX) * (newScale / scale);
            panY = clientY - (clientY - panY) * (newScale / scale);
            scale = newScale;

            updateTransform();
        }

        container.addEventListener('mousedown', (e) => {
            if (e.target.closest('.node-card') || e.target.closest('button')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        container.addEventListener('touchstart', (e) => {
            if (e.target.closest('.node-card') || e.target.closest('button')) return;
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            panX = e.touches[0].clientX - panX;
            panY = e.touches[0].clientY - startY;
            updateTransform();
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
            zoomToPoint(e.clientX, e.clientY, factor);
        }, { passive: false });

        function renderMindmap() {
            nodesContainer.innerHTML = '';
            const rootEl = createNodeElement(mindmapData, rootX, rootY, true);
            nodesContainer.appendChild(rootEl);

            mindmapData.children.forEach((branch, index) => {
                let branchX = rootX;
                let branchY = rootY;

                if (index === 0) {
                    branchX = rootX - 430;
                    branchY = rootY - 180;
                } else if (index === 1) {
                    branchX = rootX - 430;
                    branchY = rootY + 180;
                } else if (index === 2) {
                    branchX = rootX + 520;
                    branchY = rootY;
                }

                const branchEl = createNodeElement(branch, branchX, branchY, false);
                nodesContainer.appendChild(branchEl);

                if (!branch.collapsed && branch.children) {
                    branch.children.forEach((leaf, leafIndex) => {
                        let leafX = branchX;
                        let leafY = branchY;

                        if (branch.id === 'muc-dich') {
                            leafX = branchX - 430;
                            leafY = branchY - 180 + (leafIndex * 180);
                        } else if (branch.id === 'ban-chat') {
                            leafX = branchX - 430;
                            leafY = branchY - 80 + (leafIndex * 160);
                        } else if (branch.id === 'cong-trinh') {
                            leafX = branchX + 520;
                            leafY = branchY - 450 + (leafIndex * 130);
                        }

                        const leafEl = createNodeElement(leaf, leafX, leafY, false);
                        nodesContainer.appendChild(leafEl);

                        if (leaf.hasSubNodes && leaf.subChildren && !leaf.collapsed) {
                            leaf.subChildren.forEach((sub, subIdx) => {
                                let subX = leafX - 380;
                                let subY = leafY - 65 + (subIdx * 65);
                                const subEl = createNodeElement(sub, subX, subY, false);
                                nodesContainer.appendChild(subEl);
                            });
                        }
                    });
                }
            });

            setTimeout(drawLines, 20);
        }

        function createNodeElement(node, x, y, isRoot = false) {
            const el = document.createElement('div');
            el.id = `node-${node.id}`;
            
            const isInteractiveLeaf = (node.type === 'leaf' && node.specs !== undefined);
            const isSubLeaf = (node.type === 'sub-leaf');
            const hasChildren = (node.type === 'branch' || (node.hasSubNodes && node.subChildren));

            if (isRoot) {
                el.style.width = '400px';
                el.style.left = `${x - 200}px`;
                el.style.top = `${y - 75}px`;
                el.className = `node-card absolute rounded-2xl border-2 border-cyan-400 bg-gradient-to-tr from-slate-950 via-slate-900 to-cyan-950 p-5 flex items-center space-x-4 z-20 shadow-2xl shadow-cyan-500/30 text-white pointer-events-auto`;
            } else if (node.type === 'branch') {
                el.style.width = '380px';
                el.style.left = `${x - 190}px`;
                el.style.top = `${y - 50}px`;
                el.className = `node-card absolute rounded-2xl border border-slate-700 bg-darkCard/95 p-4 flex items-center space-x-3.5 z-20 shadow-xl text-slate-100 border-l-4 border-l-cyan-400 font-semibold pointer-events-auto`;
            } else if (isSubLeaf) {
                el.style.width = '320px';
                el.style.left = `${x - 160}px`;
                el.style.top = `${y - 30}px`;
                el.className = `node-card absolute rounded-xl border border-slate-700 bg-slate-900/95 p-3 flex items-center space-x-2.5 z-20 shadow-md text-slate-300 text-xs pointer-events-auto opacity-95`;
            } else {
                el.style.width = '420px';
                el.style.left = `${x - 210}px`;
                el.style.top = `${y - 45}px`;
                const interactiveClass = isInteractiveLeaf ? 'interactive cursor-pointer hover:border-cyan-400' : 'opacity-95';
                el.className = `node-card absolute rounded-2xl border border-slate-800 bg-slate-900/95 p-4 flex items-center space-x-3 z-20 shadow-lg text-slate-200 text-xs pointer-events-auto ${interactiveClass}`;
            }

            let iconBg = isRoot ? 'bg-cyan-400 text-slate-950 font-bold text-lg' : node.type === 'branch' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-base' : isSubLeaf ? 'bg-slate-800 text-emerald-400 text-sm' : 'bg-slate-800 text-cyan-400 text-sm';

            let subtext = '';
            if (isRoot) {
                subtext = 'Mục lục tổng quan';
            } else if (node.type === 'branch') {
                subtext = `${node.children ? node.children.length : 0} nhánh nội dung`;
            } else if (isSubLeaf) {
                subtext = '';
            } else if (isInteractiveLeaf) {
                subtext = '<i class="fa-solid fa-arrow-pointer mr-1"></i> Click xem chi tiết & Hình ảnh';
            }

            let html = `
                <div class="${isSubLeaf ? 'w-8 h-8' : 'w-10 h-10'} rounded-xl flex-shrink-0 flex items-center justify-center ${iconBg} shadow-md">
                    <i class="fa-solid ${node.icon}"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 class="font-extrabold tracking-tight whitespace-normal leading-relaxed ${isRoot ? 'text-white text-base whitespace-pre-line' : node.type === 'branch' ? 'text-white text-sm' : isSubLeaf ? 'text-slate-200 text-xs' : 'text-slate-100 text-xs'}">${node.title}</h4>
                    ${subtext ? `<p class="text-[11px] mt-1 ${isRoot ? 'text-cyan-300 font-semibold' : node.type === 'branch' ? 'text-slate-400' : isInteractiveLeaf ? 'text-cyan-400 font-medium' : 'text-slate-400'}">${subtext}</p>` : ''}
                </div>
            `;

            if (hasChildren) {
                html += `
                    <button onclick="toggleNode(event, '${node.id}')" class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-cyan-400 hover:text-slate-950 text-cyan-400 flex items-center justify-center transition flex-shrink-0 shadow-md border border-slate-700 cursor-pointer pointer-events-auto" title="Thu gọn / Mở rộng">
                        <i class="fa-solid ${node.collapsed ? 'fa-plus' : 'fa-minus'} text-xs"></i>
                    </button>
                `;
            }

            el.innerHTML = html;

            el.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                if (isInteractiveLeaf) {
                    openDetailModal(node);
                } else if (hasChildren) {
                    node.collapsed = !node.collapsed;
                    renderMindmap();
                }
            });

            return el;
        }

        function drawLines() {
            const svg = document.getElementById('mindmapLines');
            svg.innerHTML = '';

            function getNodeRect(nodeId) {
                const el = document.getElementById(`node-${nodeId}`);
                if (!el) return null;
                const left = parseFloat(el.style.left);
                const top = parseFloat(el.style.top);
                const width = el.offsetWidth;
                const height = el.offsetHeight;
                return {
                    left: left,
                    right: left + width,
                    top: top,
                    bottom: top + height,
                    x: left + width / 2,
                    y: top + height / 2,
                    width: width,
                    height: height
                };
            }

            const rootRect = getNodeRect('root');
            if (!rootRect) return;

            mindmapData.children.forEach(branch => {
                const branchRect = getNodeRect(branch.id);
                if (branchRect) {
                    const startPoint = getBorderIntersection(rootRect, branchRect);
                    const endPoint = getBorderIntersection(branchRect, rootRect);
                    drawNeonCurve(svg, startPoint.x, startPoint.y, endPoint.x, endPoint.y, '#38bdf8', 4);

                    if (!branch.collapsed && branch.children) {
                        branch.children.forEach(leaf => {
                            const leafRect = getNodeRect(leaf.id);
                            if (leafRect) {
                                const bStart = getBorderIntersection(branchRect, leafRect);
                                const lEnd = getBorderIntersection(leafRect, branchRect);
                                drawNeonCurve(svg, bStart.x, bStart.y, lEnd.x, lEnd.y, '#64748b', 2.5);

                                if (leaf.hasSubNodes && leaf.subChildren && !leaf.collapsed) {
                                    leaf.subChildren.forEach(sub => {
                                        const subRect = getNodeRect(sub.id);
                                        if (subRect) {
                                            const lStart = getBorderIntersection(leafRect, subRect);
                                            const sEnd = getBorderIntersection(subRect, leafRect);
                                            drawNeonCurve(svg, lStart.x, lStart.y, sEnd.x, sEnd.y, '#34d399', 2);
                                        }
                                    });
                                }
                            }
                        });
                    }
                }
            });
        }

        function getBorderIntersection(rectA, rectB) {
            const centerA = { x: rectA.x, y: rectA.y };
            const centerB = { x: rectB.x, y: rectB.y };

            const dx = centerB.x - centerA.x;
            const dy = centerB.y - centerA.y;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) {
                    return { x: rectA.right, y: rectA.y };
                } else {
                    return { x: rectA.left, y: rectA.y };
                }
            } else {
                if (dy > 0) {
                    return { x: rectA.x, y: rectA.bottom };
                } else {
                    return { x: rectA.x, y: rectA.top };
                }
            }
        }

        function drawNeonCurve(svg, x1, y1, x2, y2, color, strokeWidth) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const dx = Math.abs(x2 - x1) * 0.5;
            const dy = (y2 - y1) * 0.1;
            const cx1 = x1 + (x2 > x1 ? dx : -dx);
            const cy1 = y1 + dy;
            const cx2 = x2 - (x2 > x1 ? dx : -dx);
            const cy2 = y2 - dy;

            const d = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
            path.setAttribute('d', d);
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', strokeWidth);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('class', 'mindmap-line');
            svg.appendChild(path);
        }

        function toggleNode(event, nodeId) {
            event.stopPropagation();
            let found = mindmapData.children.find(b => b.id === nodeId);
            if (found) {
                found.collapsed = !found.collapsed;
            } else {
                mindmapData.children.forEach(b => {
                    if (b.children) {
                        let leaf = b.children.find(l => l.id === nodeId);
                        if (leaf) {
                            leaf.collapsed = !leaf.collapsed;
                        }
                    }
                });
            }
            renderMindmap();
        }

        function expandAll() {
            mindmapData.children.forEach(b => {
                b.collapsed = false;
                if(b.children) {
                    b.children.forEach(l => l.collapsed = false);
                }
            });
            renderMindmap();
        }

        function collapseAll() {
            mindmapData.children.forEach(b => {
                b.collapsed = true;
                if(b.children) {
                    b.children.forEach(l => l.collapsed = true);
                }
            });
            renderMindmap();
        }

        function openDetailModal(node) {
            document.getElementById('modalTitle').innerText = node.title;
            document.getElementById('modalDescription').innerText = node.desc || "Không có mô tả chi tiết.";
            
            const specsContainer = document.getElementById('modalDetails');
            specsContainer.innerHTML = '';
            
            const workImage = document.getElementById('workImage');

            if (node.specs && node.specs.length > 0) {
                workImage.src = node.specs[0].imageUrl || "dan_link_vao_day";
                document.getElementById('imageLabel').innerText = `Hình ảnh: ${node.specs[0].text}`;

                node.specs.forEach((spec, idx) => {
                    const div = document.createElement('div');
                    div.className = `flex items-center space-x-2.5 p-3 rounded-xl border transition cursor-pointer ${idx === 0 ? 'bg-cyan-500/20 border-cyan-500/50 text-white shadow-sm' : 'bg-slate-900/90 border-slate-800 text-slate-300 hover:bg-slate-800'}`;
                    div.innerHTML = `<i class="fa-solid fa-circle-check text-cyan-400 text-xs"></i><span class="font-medium">${spec.text}</span>`;
                    
                    div.onclick = () => {
                        specsContainer.querySelectorAll('div').forEach(el => {
                            el.className = 'flex items-center space-x-2.5 p-3 rounded-xl border border-slate-800 bg-slate-900/90 text-slate-300 hover:bg-slate-800 transition cursor-pointer';
                        });
                        div.className = 'flex items-center space-x-2.5 p-3 rounded-xl border border-cyan-500/50 bg-cyan-500/20 text-white transition cursor-pointer shadow-sm';
                        
                        workImage.src = spec.imageUrl || "dan_link_vao_day";
                        document.getElementById('imageLabel').innerText = `Hình ảnh: ${spec.text}`;
                    };

                    specsContainer.appendChild(div);
                });
            } else {
                specsContainer.innerHTML = '<p class="text-slate-500 italic">Không có thông số đi kèm.</p>';
                workImage.src = "dan_link_vao_day";
                document.getElementById('imageLabel').innerText = `Hình ảnh Công trình`;
            }

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        window.onload = function() {
            renderMindmap();
            resetView();
            window.addEventListener('resize', () => { drawLines(); });
        };
    </script>
</body>
</html>
